<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- المعدن نفسه المستخدم في .text-grad -->
    <linearGradient id="metal" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e3e0da"/>
      <stop offset="1" stop-color="#8f8b83"/>
    </linearGradient>
    <!-- تلوين اللوح الزجاجي: أفتح في الأعلى، يخفت للأسفل -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- الوميض العلوي: الحافة المضيئة بسمك بكسل واحد -->
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="23" fill="#0a0a0a"/>
  <rect width="100" height="100" rx="23" fill="url(#glass)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.25" fill="none" stroke="url(#spec)" stroke-width="1.5"/>

  <text x="50" y="50" dy="0.35em" text-anchor="middle"
        font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="43" font-weight="600" letter-spacing="-2" fill="url(#metal)">AR</text>
</svg>
