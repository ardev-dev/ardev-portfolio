body{background:var(--dbg);color:#fff;line-height:1.25;font-weight:600;display:flex;flex-direction:column;padding-bottom:34px}
.blob{position:absolute;border-radius:50%}
.hd{position:relative;padding:8px 16px}
.hd .r{display:flex;align-items:center;gap:12px}
.bk{width:40px;height:40px;border-radius:12px;background:var(--dsurface);border:1px solid rgba(245,158,11,.3);display:grid;place-items:center;font-size:16px;flex:none}
.cnt{flex:1;padding:8px 14px;border-radius:20px;background:var(--dsurface);border:1px solid rgba(245,158,11,.2);text-align:center;font-size:14px}
.stk{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:20px;background:linear-gradient(90deg,#FF6B35,#FF4E50);font-size:14px;flex:none}

.pc.on{background:linear-gradient(135deg,#F59E0B,#9B59B6);border-color:transparent}
.pc .c{width:36px;height:36px;border-radius:50%;background:rgba(245,158,11,.12);display:grid;place-items:center;font-size:18px;color:rgba(255,255,255,.6);flex:none}
.pc.on .c{background:rgba(255,255,255,.2);color:#fff}
.pc .tx{flex:1;margin-right:8px}
.pc .tx b{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}.pc.on .tx b{color:#fff}
.pc .tx span{display:block;font-size:14px;color:rgba(245,158,11,.9)}.pc.on .tx span{color:#fff}
.pc .py{padding:4px;border-radius:50%;background:rgba(255,255,255,.2);font-size:14px;display:grid}
.vs{margin:0 8px;padding:8px 10px;border-radius:12px;background:var(--dsurface);border:1px solid rgba(245,158,11,.3);color:var(--primary);font-size:12px;flex:none}
.panel{position:relative;flex:1;margin-top:10px;background:rgba(10,10,11,.95);border-radius:30px 30px 0 0;border-top:1.500px solid rgba(245,158,11,.25);padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center}
.pw{display:flex;gap:10px}
.pb{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:14px;border:1px solid;font-size:12px}
.pb i{font-size:16px}
.pb.used{background:var(--dsurface);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.25)}
.tm{margin-top:16px;display:flex;align-items:center;padding:14px;border-radius:20px;background:var(--dsurface);border:1px solid rgba(245,158,11,.35)}
.tm .ring{width:54px;height:54px;position:relative;display:grid;place-items:center;font-size:18px}
.tm .ring svg{position:absolute;inset:0}
.tm .tx{margin-right:16px}
.tm .tx b{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--primary);font-weight:600}
.tm .tx b i{font-size:18px}
.tm .tx span{display:block;margin-top:4px;font-size:12px;font-weight:400;color:rgba(255,255,255,.55)}
.qc{align-self:stretch;margin-top:18px;padding:22px;border-radius:22px;background:var(--dsurface);border:1.500px solid rgba(245,158,11,.3);display:flex;flex-direction:column;align-items:center}
.qc .ic{padding:12px;border-radius:50%;background:linear-gradient(90deg,#F59E0B,#9B59B6);font-size:24px;display:grid}
.qc p{margin-top:16px;font-size:18px;line-height:1.6;text-align:center}
.op{align-self:stretch;display:flex;align-items:center;padding:16px;border-radius:18px;background:var(--dsurface);border:2px solid rgba(255,255,255,.08);margin-bottom:12px;font-size:15px;color:rgba(255,255,255,.85)}
.op .l{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:17px;color:rgba(255,255,255,.55);margin-left:14px;flex:none}
.op span{flex:1}
.op.ok{background:rgba(16,185,129,.12);border-color:#10B981;color:#fff}
.op.ok .l{background:linear-gradient(90deg,#10B981,#34D399);color:#fff}
